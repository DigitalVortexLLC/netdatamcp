# Vendor YANG Model Repository Configuration
#
# This file configures which vendor YANG model repositories to sync and process.
#
# Quick Start:
#   1. Run: python manage_vendors.py --import
#      This launches an interactive wizard to select vendors and versions
#
#   2. Or manually configure vendors below and run:
#      python manage_vendors.py --sync --process
#
# The --import mode is recommended as it provides:
#   - Interactive vendor selection from a catalog (Juniper, Nokia, Cisco, Arista)
#   - Version selection per vendor (latest, default, specific versions, ranges)
#   - Automatic configuration of this file
#   - Automatic repository sync and YANG file processing

vendors:
  nokia:
    name: "Nokia"
    repo_url: "https://github.com/nokia/7x50_YangModels.git"
    description: "Nokia 7x50 YANG Models"
    # Paths within the repo where YANG files are located (supports wildcards)
    yang_paths:
      - "latest_sros_23.10/**/*.yang"
      - "latest_sros_24.3/**/*.yang"
    # Optional: specific branch or tag to checkout
    branch: "master"
    enabled: true
    selected_versions:
      - "23.10"
      - "24.3"

  # To add Juniper YANG models, use the interactive import:
